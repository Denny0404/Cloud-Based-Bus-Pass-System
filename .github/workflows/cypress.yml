name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensures all files are fetched

      - name: Debug Repository Structure
        run: ls -lah  # Check if busspasssystem exists

      - name: Checkout Submodules (if needed)
        run: git submodule update --init --recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start PHP Server
        run: |
          php -S 0.0.0.0:8080 -t ./busspasssystem > server.log 2>&1 &
          sleep 5
          curl -I http://localhost:8080 || (echo "ERROR: PHP server failed to start!" && cat server.log && exit 1)

      - name: Wait for Server to be Ready
        run: npx wait-on tcp:localhost:8080 --timeout 60000 || (echo "ERROR Server did not start in time!" && exit 1)

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Run Cypress Tests
        run: npm run test || (echo "ERROR Cypress Tests Failed!" && exit 1)
