name: Cypress CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install Dependencies
        run: |
          npm install
          npx cypress install  # Ensures Cypress is properly installed
          chmod +x node_modules/.bin/cypress  # Fixes permission issue

      - name: 🏃 Run Cypress Tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/test/busPass.cy.js" --reporter mochawesome
