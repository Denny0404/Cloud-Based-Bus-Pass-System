name: Cypress CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup PHP & Apache
        run: |
          sudo apt update
          sudo apt install -y apache2 php php-mysql unzip
          sudo service apache2 start
          sudo rm -rf /var/www/html/*  # Clean old files
          sudo cp -r * /var/www/html/  # Move files to Apache root
          sudo chmod -R 755 /var/www/html/
          sudo sed -i 's/Listen 80/Listen 8080/' /etc/apache2/ports.conf
          sudo service apache2 restart

      - name: 🔍 Debug Apache Index Page
        run: curl -s http://localhost:8080/ > apache_index.html
        
      - name: 📝 Upload Debug File
        uses: actions/upload-artifact@v3
        with:
          name: Apache_Index_Page
          path: apache_index.html

      - name: 🚀 Restart Apache & Wait
        run: |
          sudo service apache2 restart
          sleep 30  # Give Apache more time to fully start

      # - name: 🚀 Verify Apache is Running
      #   run: |
      #     sudo service apache2 status || (echo "Apache Failed to Start" && exit 1)
      #     curl -Is http://localhost:8080 || (echo "Server is not reachable" && exit 1)

      - name: 📦 Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npx cypress install

      - name: ⏳ Wait for Server to Start
        run: sleep 30  # Increase wait time for Apache to fully load

      - name: 🏃 Run Cypress Tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/test/busPass.cy.js" --reporter mochawesome