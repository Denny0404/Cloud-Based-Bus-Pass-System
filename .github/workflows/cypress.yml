name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  # pull_request:
  #   branches:
  #     - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci  # Clean install for consistency

      - name: Ensure Reports Directory Exists
        run: mkdir -p cypress/reports

      - name: Wait for XAMPP Server to Start
        run: npx wait-on http://localhost:8080/busspasssystem --timeout 60000  # Waits for app startup

      - name: Run Cypress Tests
        run: npm run test

      - name: Generate Test Report
        run: npm run cypress:report

      - name: Upload Cypress Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-reports
          path: cypress/reports
