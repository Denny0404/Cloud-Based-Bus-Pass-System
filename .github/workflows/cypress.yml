name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=10s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Start PHP Server
        run: php -S 127.0.0.1:8080 -t . &

      - name: Wait for MySQL to Start
        run: |
          for i in {1..10}; do
            mysqladmin ping -h127.0.0.1 -uroot --password=root && break
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Import Database
        run: |
          mysql -h127.0.0.1 -uroot --password=root travel < busspasssystem/db_dump.sql

      - name: Debug MySQL Connection
        run: mysql -h127.0.0.1 -uroot --password=root -e "SHOW DATABASES;"

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Run Cypress Tests
        run: npm run test
