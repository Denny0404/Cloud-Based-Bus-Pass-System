name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci  # Use npm ci for a clean install

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Start Web Server
        run: npm start &  # Start the application in the background

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:8080 --timeout 60000 || (echo "Server did not start in time" && exit 1)

      # - name: Set Correct Permissions
      #   run: sudo chmod -R 777 $(npm root -g)/cypress || true

      # - name: Verify Cypress Installation
      #   run: npx cypress --version

      - name: Run Cypress Tests
        run: npm run test
