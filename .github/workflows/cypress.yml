name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start PHP Server
        run: php -S localhost:8080 -t . & sleep 5

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:8080 --timeout 120000 || (echo "Server did not start in time" && exit 1)

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: |
          npm install
          npx cypress install

      - name: Run Cypress Tests
        run: npm run test
