name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci  # Use npm ci for a clean install

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Start Web Server
        run: |
          npm start &
          sleep 10  # Wait to ensure the server starts

      - name: Check if Server is Running
        run: curl -Is http://localhost:8080 | head -n 1 || (echo "Server did not start" && exit 1)

      # - name: Set Correct Permissions
      #   run: sudo chmod -R 777 $(npm root -g)/cypress || true

      # - name: Verify Cypress Installation
      #   run: npx cypress --version

      - name: Run Cypress Tests
        run: npm run test
