name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: List Directory Structure (Debugging)
        run: ls -R

      - name: Start PHP Server
        run: php -S localhost:8080 -t ./Cloud-Based-Bus-Pass-System &

      - name: Wait for Server to be Ready
        run: |
          sleep 10 # Ensure server has time to start
          curl --retry 10 --retry-delay 5 --retry-connrefused -s http://localhost:8080/Cloud-Based-Bus-Pass-System/index.html || exit 1

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Upgrade to Node.js 20+ to prevent EBADENGINE errors

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 xvfb

      - name: Run Cypress Tests
        run: |
          export DISPLAY=:99
          Xvfb :99 -ac &
          npx cypress run --browser chrome --headless --spec "cypress/e2e/test/busPass.cy.js" --reporter mochawesome
