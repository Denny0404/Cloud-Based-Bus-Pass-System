name: Cypress Live Test

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Start Live Server
        run: |
          npm start &
          sleep 10

      - name: Ensure Cypress Executable Permission
        run: chmod +x node_modules/.bin/cypress || true

      - name: Run Cypress Tests on Live Server
        run: npm run test