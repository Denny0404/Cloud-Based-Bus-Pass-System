name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  # Ensure this matches your local PHP version

      - name: Verify busspasssystem Directory Exists
        run: ls -lah busspasssystem || (echo "ERROR busspasssystem folder missing!" && exit 1)

      - name: Start PHP Server
        run: |
          php -S 0.0.0.0:8080 -t . > server.log 2>&1 &
          sleep 5
          curl -I http://localhost:8080/busspasssystem/ || (echo "ERROR: PHP server failed to start!" && cat server.log && exit 1)

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:8080/ --timeout 60000 || (echo "ERROR Server did not start in time!" && exit 1)

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Run Cypress Tests
        run: npm run test || (echo "ERROR Cypress Tests Failed!" && exit 1)
