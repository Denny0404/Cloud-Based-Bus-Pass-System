name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress with Correct Permissions
        run: |
          npx cypress install || true
          chmod +x node_modules/.bin/cypress || true

      - name: Verify Cypress Installation
        run: npx cypress --version

      - name: Fix react-scripts Permissions
        run: chmod +x node_modules/.bin/react-scripts

      - name: Install Testing Library Dependencies
        run: npm install --save-dev @testing-library/react @testing-library/jest-dom @testing-library/user-event

      - name: Run Tests
        run: npm run test
