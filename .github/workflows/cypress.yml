name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start PHP Server
        run: |
          nohup php -S 127.0.0.1:8080 -t public > server.log 2>&1 &
      
      - name: Install wait-on
        run: npm install -g wait-on

      - name: Wait for Server to be Ready
        run: |
          for i in {1..10}; do
            curl -Is 127.0.0.1:8080 && break
            echo "Waiting for server..."
            sleep 2
          done

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Install Cypress
        run: npx cypress install || echo "Cypress already installed"

      - name: Run Cypress Tests
        run: npx cypress run --browser chrome --headless

      - name: Upload Cypress Videos & Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
