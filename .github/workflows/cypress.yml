name: Cypress CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup PHP & Apache
        run: |
          sudo apt update
          sudo apt install -y apache2 php php-mysql unzip
          sudo service apache2 start
          sudo cp -r * /var/www/html/  # Copy project files to Apache root
          sudo chmod -R 755 /var/www/html/

      - name: 📦 Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npx cypress install

      - name: 🚀 Wait for Apache to Start
        run: sleep 10  # Wait for the server to be ready

      - name: 🏃 Run Cypress Tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/test/busPass.cy.js" --reporter mochawesome