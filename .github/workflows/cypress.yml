name: Cypress CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Kill any running server
        run: pkill -f "node" || true

      - name: Start Server
        run: nohup npm start > server.log 2>&1 &
        env:
          CI: false

      - name: Verify Server is Running
        run: |
          sleep 10
          curl -I http://localhost:8080/Cloud-Based-Bus-Pass-System || echo "Server is not responding"
          cat server.log || echo "No logs found"

      - name: Wait for Server to Start (Max 30s)
        run: npx wait-on http://localhost:8080 --timeout 60000 || (echo "Server did not start in time" && exit 1)

      - name: Run Cypress Tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/test/busPass.cy.js" --reporter mochawesome



