name: Deploy PHP to Hostinger

on:
  push:
    branches:
      - development  # Change to your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: blue-aardvark-631260.hostingersite.com # Use Hostinger's FTP hostname instead of IP
          username: ${{ secrets.FTP_USER }}  # Securely store username in GitHub Secrets
          password: ${{ secrets.FTP_PASS }}  # Securely store password in GitHub Secrets
          protocol: ftp  # Change to 'sftp' if needed
          port: 21  # Use 22 for SFTP
          local-dir: "./"
          server-dir: "/public_html/"  # Change if your Hostinger directory is different

      - name: Verify Deployment
        run: echo "Deployment to Hostinger Completed!"